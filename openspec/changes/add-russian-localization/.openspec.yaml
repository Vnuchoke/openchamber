schema: spec-driven
created: 2026-10-31
goal: >-
  Добавить русский язык в OpenChamber, чтобы пользователь мог работать с русским
  интерфейсом, получать русские серверные уведомления, генерировать Changes
  Walkthrough по-русски и читать русскую документацию.


  ## Контекст


  В исследованном коде OpenChamber 2.5.3 русский отсутствует среди UI-локалей, в
  серверном списке языков Walkthrough, стандартных шаблонах серверных
  уведомлений и переводах документации. Walkthrough использует список языков
  интерфейса; сервер преобразует неподдерживаемые `ru` и `ru-RU` в английский.
  Поддержка русского содержимого в отдельных голосовых и AI-функциях уже
  существует.


  ## Согласованный объём


  1. Общий интерфейс: зарегистрировать русскую локаль и добавить русский перевод
  в существующую систему i18n. Поддержка должна распространяться на использующие
  общий UI web, desktop, mobile и VS Code с учётом доступных в каждом окружении
  функций.

  2. Changes Walkthrough: добавить русский в выбор языка и серверную обработку.
  На русском должны генерироваться названия, пояснения, наблюдения и примечания.
  Идентификаторы, пути, имена API, ключи JSON и служебные значения сохраняются
  без перевода.

  3. Серверные уведомления: добавить русские стандартные заголовки и сообщения,
  сохранив работу пользовательских шаблонов.

  4. Документация: добавить русскую версию, включая страницу Changes
  Walkthrough, и подключить её к существующей навигации и механизму публикации.


  Русский перевод нативного меню и контекстного меню Electron не обязателен и не
  входит в обязательные критерии готовности.


  ## Дополнительный аспект для обсуждения


  Включить в проработку change выбор языка генерации PR/MR. Стандартный промпт
  сейчас не задаёт явного правила выбора языка, а без шаблона использует
  заголовки `Summary`, `Why`, `Testing`.


  До реализации этой части согласовать:

  - источник языка результата: язык интерфейса, контекст репозитория или
  отдельный выбор;

  - необходимость перевода стандартных заголовков;

  - поведение при наличии репозиторного шаблона.


  Конкретное поведение PR/MR ещё не согласовано. Не менять его на основании
  предположений; зафиксировать принятое решение либо явно отложить эту часть.


  ## Ограничения


  Использовать существующую архитектуру локализации и принятые проектом
  механизмы. Сохранить поддержку остальных языков, пользовательские настройки и
  шаблоны. Не менять язык интерфейса по умолчанию для всех пользователей и не
  расширять задачу на переработку голосовых функций.


  Перед реализацией уточнить состав русской документации и необходимость
  изменений конфигурации публикации в отдельном репозитории сайта. Согласование
  цели не означает разрешения изменять другой репозиторий.


  ## Критерии готовности


  - Русский доступен в настройках языка; выбор и сохранение работают по
  существующим правилам приложения.

  - Русский словарь покрывает актуальные ключи общего интерфейса и сохраняет
  подстановки и форматирование.

  - Walkthrough принимает `ru` и региональные варианты без перехода на
  английский, генерирует русские пояснения и корректно разделяет языки в кэше.

  - Стандартные серверные уведомления отображаются по-русски при выбранной
  русской локали; пользовательские шаблоны продолжают работать.

  - Русская документация доступна через навигацию сайта; ссылки, метаданные и
  согласованный набор страниц проходят проверки.

  - Выполнены релевантные проверки словарей, языковой нормализации, уведомлений
  и Walkthrough, а также проверка документации. Результаты ручной проверки и
  непроверенные окружения явно указаны.
